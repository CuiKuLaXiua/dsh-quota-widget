<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>令牌层验证 · --oq-* 在两种主题下的实际取值</title>
<style>
:root{
  --bg:#0b0c0f; --card:#14161b; --hair:#24262d; --ink:#eceef6; --mute:#9b9dae; --dim:#6d7080;
  --acc:#8b7bff;
  --font:"Inter",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:30px 20px 60px}
h1{margin:0 0 6px;font-size:20px;font-weight:650;letter-spacing:-.3px}
.lead{margin:0 0 20px;font-size:12px;line-height:1.8;color:var(--mute)}
.lead code{font-family:var(--mono);font-size:11px;background:#1b1e25;padding:1px 5px;border-radius:3px;color:#b3aaff}

.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.btn{
  padding:6px 13px;border-radius:9px;border:1px solid var(--hair);background:#191c22;
  color:var(--mute);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;
  transition:border-color .14s,background .14s,color .14s;
}
.btn:hover{border-color:#3a3e48;color:var(--ink)}
.btn[data-on="1"]{border-color:rgba(139,123,255,.55);background:rgba(139,123,255,.14);color:#d9d3ff}

.stack{display:grid;gap:14px}
.pane{
  border:1px solid var(--hair);border-radius:14px;overflow:hidden;background:var(--card);
}
.pane .ph{
  padding:10px 14px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);
}
.pane .ph b{color:var(--ink);font-weight:600;letter-spacing:0;font-size:11px;font-family:var(--font);text-transform:none}
.pane .pb{padding:16px}

/* 每个 pane 内注入一套宿主变量，模拟 DSH 的明暗 */
.pane[data-dsw="dark"]{
  --dsw-alias-bg-layer-2:#1a1a1f; --dsw-alias-bg-layer-1:#242433;
  --dsw-alias-border-l1:rgba(255,255,255,0.08); --dsw-alias-border-l2:rgba(255,255,255,0.14);
  --dsw-alias-label-primary:#ffffff; --dsw-alias-label-secondary:#a0a0b0; --dsw-alias-label-caption:#9a9aaa;
  --dsw-alias-state-business-primary:#8b7bff; --dsw-alias-state-success-primary:#34d399;
}
.pane[data-dsw="light"]{
  --dsw-alias-bg-layer-2:#ffffff; --dsw-alias-bg-layer-1:#f6f5f4;
  --dsw-alias-border-l1:rgba(0,0,0,0.10); --dsw-alias-border-l2:rgba(0,0,0,0.16);
  --dsw-alias-label-primary:#1a1a1a; --dsw-alias-label-secondary:#5f5f68; --dsw-alias-label-caption:#8a8a94;
  --dsw-alias-state-business-primary:#6d5bff; --dsw-alias-state-success-primary:#10b981;
}

/* 与 client.js 完全相同的令牌层（复制一份用于验证） */
.pane[data-dsw]{
  --oq-canvas:var(--dsw-alias-bg-layer-2);
  --oq-surface:var(--dsw-alias-bg-layer-1);
  --oq-hairline:var(--dsw-alias-border-l1);
  --oq-ink:var(--dsw-alias-label-primary);
  --oq-muted:var(--dsw-alias-label-secondary);
  --oq-faint:color-mix(in oklab, var(--dsw-alias-label-caption) 76%, var(--dsw-alias-label-primary) 24%);
  --oq-body:color-mix(in oklab, var(--dsw-alias-label-primary) 88%, var(--dsw-alias-bg-layer-2) 12%);
  --oq-surface-2:color-mix(in oklab, var(--dsw-alias-bg-layer-1) 90%, var(--dsw-alias-label-primary) 10%);
  --oq-accent:var(--dsw-alias-state-business-primary);
  --oq-success:color-mix(in oklab, var(--dsw-alias-state-success-primary) 66%, var(--dsw-alias-label-primary) 34%);
  --bmon-h0:color-mix(in oklab, var(--dsw-alias-state-business-primary) 8%, var(--dsw-alias-bg-layer-2) 92%);
  --bmon-h1:color-mix(in oklab, var(--dsw-alias-state-business-primary) 26%, var(--dsw-alias-bg-layer-2) 74%);
  --bmon-h2:color-mix(in oklab, var(--dsw-alias-state-business-primary) 44%, var(--dsw-alias-bg-layer-2) 56%);
  --bmon-h3:color-mix(in oklab, var(--dsw-alias-state-business-primary) 62%, var(--dsw-alias-bg-layer-2) 38%);
  --bmon-h4:color-mix(in oklab, var(--dsw-alias-state-business-primary) 78%, var(--dsw-alias-bg-layer-2) 22%);
  --bmon-h5:color-mix(in oklab, var(--dsw-alias-state-business-primary) 88%, var(--dsw-alias-bg-layer-2) 12%);
  --bmon-h6:color-mix(in oklab, var(--dsw-alias-state-business-primary) 90%, var(--dsw-alias-label-primary) 10%);
  background:var(--oq-canvas);color:var(--oq-ink);
}

/* 采样行 */
.row{display:grid;grid-template-columns:132px 1fr 82px;gap:10px;align-items:center;padding:5px 0;
  border-bottom:1px solid var(--oq-hairline);font-size:11.5px}
.row:last-child{border-bottom:none}
.row .nm{font-family:var(--mono);font-size:10.5px;color:var(--oq-muted)}
.row .sw{height:22px;border-radius:5px;border:1px solid var(--oq-hairline)}
.row .vv{font-family:var(--mono);font-size:10px;color:var(--oq-muted);text-align:right;font-variant-numeric:tabular-nums}
.row .vv b{font-weight:600}

.sec{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--oq-faint);margin:14px 0 4px}
.sec:first-child{margin-top:0}

/* tab 预览 */
.tabs{display:flex;align-items:stretch;gap:4px;flex-wrap:nowrap;margin:10px 0 0;padding:4px;
  border:1px solid var(--oq-hairline);border-radius:10px;background:var(--oq-surface)}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--oq-faint);font-size:10.5px;font-weight:500;line-height:1.2;
  background:none;border:1px solid transparent;border-radius:8px;padding:7px 3px 6px}
.tab svg{opacity:.72}
.tab.on{background:color-mix(in oklab, var(--oq-accent) 14%, transparent);
  border-color:color-mix(in oklab, var(--oq-accent) 38%, transparent);color:var(--oq-accent);font-weight:600}
.tab.on svg{opacity:1}

.pass{color:#4cc46a;font-weight:600}
.fail{color:#e06a6a;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>令牌层验证</h1>
  <p class="lead">
    这是 <code>lib/client.js</code> 里新令牌层的<b>副本</b>，用来在浏览器里实测取值。
    左右两个面板分别注入 DSH 的深色 / 浅色宿主变量——
    <b>令牌定义完全相同，只有 <code>--dsw-alias-*</code> 的值不同</b>。
    如果色块跟着变，说明插件确实在跟随宿主主题，而不是自己判断明暗。
  </p>

  <div class="bar">
    <button class="btn" data-v="both" data-on="1">并排</button>
    <button class="btn" data-v="dark">只看深色</button>
    <button class="btn" data-v="light">只看浅色</button>
  </div>

  <div class="stack" id="stack">

    <div class="pane" data-dsw="dark">
      <div class="ph"><b>宿主深色</b> <span id="st-dark"></span></div>
      <div class="pb" data-body="dark"></div>
    </div>

    <div class="pane" data-dsw="light">
      <div class="ph"><b>宿主浅色</b> <span id="st-light"></span></div>
      <div class="pb" data-body="light"></div>
    </div>

  </div>
</div>

<script>
var TOKENS = [
  ["结构色", [["canvas","--oq-canvas"],["surface","--oq-surface"],["surface-2","--oq-surface-2"],["hairline","--oq-hairline"]]],
  ["文字", [["ink","--oq-ink"],["body","--oq-body"],["muted","--oq-muted"],["faint","--oq-faint"]]],
  ["语义", [["accent","--oq-accent"],["success","--oq-success"]]],
  ["热力 h0–h6", [["h0","--bmon-h0"],["h1","--bmon-h1"],["h2","--bmon-h2"],["h3","--bmon-h3"],["h4","--bmon-h4"],["h5","--bmon-h5"],["h6","--bmon-h6"]]],
];

var ICONS = {
  usage:"M2 12V7M6 12V4M10 12V9M14 12V2",
  query:"M10.5 10.5L14 14",
  conf:"M2 6h12",
  data:"M2.6 4v8c0 1.2 2.4 2.2 5.4 2.2s5.4-1 5.4-2.2V4",
  gen:"M8 1.7v1.7M8 12.6v1.7M1.7 8h1.7M12.6 8h1.7",
  maint:"M10.4 2.2a3.6 3.6 0 004.4 4.7l-8 8a2.2 2.2 0 01-3.1-3.1z",
  gateway:"M2 5.6h12M2 10.4h12"
};
var LABELS = {usage:"用量统计",query:"用量查询",conf:"外观",data:"数据源",gen:"通用",maint:"维护",gateway:"网关"};

function svgFor(k){
  var extra = "";
  if (k==="query") extra = '<circle cx="7" cy="7" r="4.5" fill="none"/>';
  else if (k==="conf") extra = '<rect x="2" y="2.6" width="12" height="10.8" rx="2" fill="none"/>';
  else if (k==="data") extra = '<ellipse cx="8" cy="4" rx="5.4" ry="2.2" fill="none"/>';
  else if (k==="gen") extra = '<circle cx="8" cy="8" r="2.3" fill="none"/>';
  else if (k==="gateway") extra = '<circle cx="5.4" cy="5.6" r="1.2" fill="currentColor" stroke="none"/><circle cx="10.6" cy="10.4" r="1.2" fill="currentColor" stroke="none"/>';
  return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="'+ICONS[k]+'"/>'+extra+'</svg>';
}

function build(host){
  var el = document.querySelector('[data-body="'+host+'"]');
  var html = "";

  TOKENS.forEach(function (group) {
    html += '<div class="sec">' + group[0] + '</div>';
    group[1].forEach(function (t) {
      html += '<div class="row">'
        + '<span class="nm">' + t[0] + '</span>'
        + '<span class="sw" style="background:var(' + t[1] + ')" data-probe="' + t[1] + '"></span>'
        + '<span class="vv" data-hex="' + t[1] + '">—</span>'
        + '</div>';
    });
  });

  // tab 预览
  html += '<div class="sec">tab 图标网格</div>';
  html += '<div class="tabs">';
  Object.keys(LABELS).forEach(function (k, i) {
    html += '<button class="tab' + (i === 0 ? ' on' : '') + '" data-key="' + k + '">'
      + svgFor(k) + '<span>' + LABELS[k] + '</span></button>';
  });
  html += '</div>';

  el.innerHTML = html;

  // 解析实际 RGB
  var cv = document.createElement('canvas');
  cv.width = cv.height = 1;
  var ctx = cv.getContext('2d', { willReadFrequently: true });
  function toHex(css) {
    ctx.clearRect(0, 0, 1, 1);
    ctx.fillStyle = '#808080';
    ctx.fillStyle = css;
    ctx.fillRect(0, 0, 1, 1);
    var d = ctx.getImageData(0, 0, 1, 1).data;
    return "#" + [d[0], d[1], d[2]].map(function (x) {
      return ("0" + x.toString(16)).slice(-2);
    }).join("");
  }
  el.querySelectorAll("[data-hex]").forEach(function (node) {
    var v = node.getAttribute("data-hex");
    var css = getComputedStyle(el).getPropertyValue(v).trim();
    if (!css) { node.textContent = "—"; return; }
    node.textContent = toHex(css);
  });
}

build("dark");
build("light");

// 简单切换
document.querySelectorAll('.btn').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.btn').forEach(function (x) { x.dataset.on = '0'; });
    b.dataset.on = '1';
    var v = b.dataset.v;
    document.querySelectorAll('.pane').forEach(function (p) {
      p.style.display = (v === 'both' || p.dataset.dsw === v) ? '' : 'none';
    });
  });
});
</script>
</body>
</html>
